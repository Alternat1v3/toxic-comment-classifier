<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <style>
      h5 {
        color: red;
      }
      @import url("https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #4070f4;
      }

      .wrapper {
        position: relative;
        max-width: 430px;
        width: 100%;
        background: #fff;
        padding: 34px;
        border-radius: 6px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .wrapper h2 {
        position: relative;
        font-size: 22px;
        font-weight: 600;
        color: #333;
      }

      .wrapper h2::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 28px;
        border-radius: 12px;
        background: #4070f4;
      }

      .wrapper form {
        margin-top: 30px;
      }

      .wrapper form .input-box {
        height: 52px;
        margin: 18px 0;
      }

      form .input-box input {
        height: 100%;
        width: 100%;
        outline: none;
        padding: 0 15px;
        font-size: 17px;
        font-weight: 400;
        color: #333;
        border: 1.5px solid #c7bebe;
        border-bottom-width: 2.5px;
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .input-box input:focus,
      .input-box input:valid {
        border-color: #4070f4;
      }

      form .policy {
        display: flex;
        align-items: center;
      }

      form h3 {
        color: #707070;
        font-size: 14px;
        font-weight: 500;
        margin-left: 10px;
      }

      .input-box.button input {
        color: #fff;
        letter-spacing: 1px;
        border: none;
        background: #4070f4;
        cursor: pointer;
      }

      .input-box.button input:hover {
        background: #0e4bf1;
      }

      form .text h3 {
        color: #333;
        width: 100%;
        text-align: center;
      }

      form .text h3 a {
        color: #4070f4;
        text-decoration: none;
      }

      form .text h3 a:hover {
        text-decoration: underline;
      }
    </style>
    {% comment %}
    <h2>Login</h2>
    {% endcomment %} {% comment %}
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    {% endcomment %}
    <div class="wrapper">
      <h2>Login Form</h2>
      {% for message in messages %}
      <h5>{{message}}</h5>
      {%endfor%}
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="input-box">
          <input
            type="text"
            name="username"
            placeholder="Enter your name"
            required
          />
        </div>
        <div class="input-box">
          <input
            type="password"
            name="password"
            placeholder="Create password"
            required
          />
        </div>
        <div class="policy">
          <input type="checkbox" />
          <h3>I accept all terms & condition</h3>
        </div>
        <div class="input-box button">
          <input type="Submit" value="Login Now" />
        </div>
        <div class="text">
          <h3>
            Don't have an account?
            <a href="http://127.0.0.1:8000/register">Register Now</a>
          </h3>
        </div>
      </form>
    </div>
    <script>
      const csrfTokenInput = document.querySelector(
        'input[name="csrfmiddlewaretoken"]'
      );
      const csrfToken = csrfTokenInput ? csrfTokenInput.value : null;
      console.log(csrfToken);
    </script>
  </body>
</html>
